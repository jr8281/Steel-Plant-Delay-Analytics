services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: steelplant
      POSTGRES_USER: steeluser
      POSTGRES_PASSWORD: steelpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steeluser -d steelplant"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://steeluser:steelpassword@db:5432/steelplant
      JWT_SECRET_KEY: change-this-for-any-public-deployment
      CORS_ORIGINS: http://localhost:8501
      GEMINI_API_KEY: AQ.Ab8RN6KZCiAI4sG0LZksi_X6cfQ7b50KVb0eypBay1D2_BAShQ
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
